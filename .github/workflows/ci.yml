name: Finkas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Unit Tests
        run: npm test

      - name: Run HTML & Tailwind Build
        run: npm run build

      - name: Verify Strict Modularity (< 430 Lines per file)
        run: |
          OVERLIMIT=0
          for f in js/*.js js/handlers/*.js js/render/*.js sw.js; do
            if [ -f "$f" ]; then
              LINES=$(wc -l < "$f")
              if [ "$LINES" -ge 430 ]; then
                echo "FAIL: $f has $LINES lines (limit: 429)"
                OVERLIMIT=1
              else
                echo "PASS: $f ($LINES lines)"
              fi
            fi
          done
          if [ "$OVERLIMIT" -eq 1 ]; then
            echo "Error: One or more source files exceed 429 lines limit."
            exit 1
          fi
          echo "All source files verified under 430 lines."
