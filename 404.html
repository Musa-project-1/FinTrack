<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Halaman Tidak Ditemukan | Finkas</title>
  <meta name="theme-color" content="#0f1011">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=124">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      /* Surfaces — Origin color step: abyss → canvas → graphite → steel */
      --lp-abyss: #090a0b;
      --lp-canvas: #0f1011;
      --lp-graphite: #2e2e2e;
      --lp-steel: #3f4041;
      --lp-void: #000000;

      /* Text */
      --lp-pure: #ffffff;
      --lp-cloud: #f5f5f7;
      --lp-ash: #9f9fa0;
      --lp-body-onstage: #b0b0b2;

      /* Hairlines */
      --lp-line: rgba(255, 255, 255, 0.15);
      --lp-line-soft: rgba(255, 255, 255, 0.10);

      /* Radius scale (R4) */
      --lp-r-btn: 8px;
      --lp-r-card: 16px;
      --lp-r-pill: 9999px;

      /* Motion — state only; tidak ada reveal di halaman ini */
      --lp-t-state: 0.2s ease;

      /* Type */
      --lp-font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --lp-font-display: 'Fraunces', Georgia, serif;
      --lp-font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      --lp-tracking-tight: -0.02em;
      --lp-tracking-body: -0.01em;
      --lp-tracking-display: -0.03em;
      --lp-tracking-eyebrow: 0.14em;

      /* Spacing — index = kelipatan basis 4px (R9) */
      --lp-sp-1: 4px;
      --lp-sp-2: 8px;
      --lp-sp-3: 12px;
      --lp-sp-4: 16px;
      --lp-sp-6: 24px;
      --lp-sp-8: 32px;
      --lp-sp-12: 48px;
      --lp-sp-20: 80px;

      /* Layout */
      --lp-content-max: 1200px;

      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .monogram { color: var(--lp-cloud); flex-shrink: 0; }
    .badge-pill {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 100%; padding: 4px 12px;
      border-radius: var(--lp-r-pill);
      background: var(--lp-steel); border: 1px solid var(--lp-line-soft);
      font-family: var(--lp-font-mono); font-size: 10.5px; font-weight: 500;
      letter-spacing: var(--lp-tracking-eyebrow); text-transform: uppercase;
      color: var(--lp-cloud); white-space: normal; overflow-wrap: anywhere;
    }
    .btn-return {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--lp-sp-2);
      background: var(--lp-pure); color: var(--lp-void); border: none;
      border-radius: var(--lp-r-btn); padding: 14px 24px; min-height: 44px;
      font-family: var(--lp-font-mono); font-size: 12px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none;
      transition: opacity var(--lp-t-state); white-space: nowrap;
    }
    .arrow { flex-shrink: 0; }
    .btn-return:hover { opacity: 0.88; }
    :focus-visible { outline: 2px solid var(--lp-pure); outline-offset: 3px; border-radius: 2px; }
    a:focus:not(:focus-visible) { outline: none; }
    @media (max-width: 359px) {
      .btn-return { padding-inline: var(--lp-sp-2); }
    }
    body {
      font-family: var(--lp-font-sans); background: var(--lp-canvas); color: var(--lp-cloud);
      letter-spacing: var(--lp-tracking-body); line-height: 1.6;
      min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: var(--lp-sp-4);
    }
    .container {
      width: 100%; max-width: 460px; padding: var(--lp-sp-8); text-align: center;
      background: var(--lp-graphite); border: 1px solid var(--lp-line-soft); border-radius: var(--lp-r-card);
    }
    .logo-badge {
      width: 64px; height: 64px; margin: 0 auto var(--lp-sp-6);
      display: flex; align-items: center; justify-content: center;
      background: var(--lp-steel); border: 1px solid var(--lp-line-soft); border-radius: var(--lp-r-btn);
    }
    .code-404 {
      font-family: var(--lp-font-display); font-weight: 300; font-size: clamp(72px, 20vw, 128px);
      line-height: 0.9; color: var(--lp-cloud); font-variant-numeric: tabular-nums;
      letter-spacing: var(--lp-tracking-display); margin: var(--lp-sp-3) 0 var(--lp-sp-2);
    }
    h1 { font-family: var(--lp-font-display); font-weight: 300; font-size: 24px; color: var(--lp-cloud); margin-bottom: var(--lp-sp-2); }
    p { font-size: 15px; color: var(--lp-ash); line-height: 1.6; max-width: 34ch; margin: 0 auto var(--lp-sp-6); }
    .btn-group { display: flex; flex-direction: column; gap: var(--lp-sp-3); margin-top: var(--lp-sp-6); }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 14px 24px;
      background: transparent; border: 1px solid var(--lp-line); color: var(--lp-cloud); border-radius: var(--lp-r-btn);
      font-family: var(--lp-font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.12em;
      text-transform: uppercase; text-decoration: none; white-space: nowrap;
      transition: background-color var(--lp-t-state);
    }
    .btn-ghost:hover { background: var(--lp-graphite); }
    .metadata { font-family: var(--lp-font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: var(--lp-tracking-eyebrow); color: var(--lp-ash); margin-top: var(--lp-sp-6); }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-badge">
      <svg class="monogram" viewBox="0 0 192 192" width="36" height="36" role="img" aria-label="Logo Finkas" focusable="false">
        <g transform="translate(51, 47)" fill="currentColor">
          <rect x="0" y="0" width="18" height="98" rx="9" />
          <rect x="0" y="0" width="82" height="18" rx="9" />
          <rect x="0" y="36" width="60" height="18" rx="9" opacity="0.72" />
          <circle cx="74" cy="45" r="9" opacity="0.55" />
        </g>
      </svg>
    </div>
    <span class="badge-pill">ERROR 404</span>
    <div class="code-404">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Tautan yang Anda tuju mungkin salah ketik, sudah dipindahkan, atau tidak lagi tersedia.</p>
    <div class="btn-group">
      <a class="btn-return" href="index.html">KEMBALI KE BERANDA
        <svg class="arrow" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <path d="M2.5 8h11M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="btn-ghost" href="onboarding.html">PILIH GRUP KAS</a>
    </div>
    <footer class="metadata">FINKAS · PEMBUKUAN KAS KOMUNITAS</footer>
  </main>
</body>
</html>
