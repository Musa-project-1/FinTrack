  <!-- 1. Modal Login Admin -->
  <div class="modal-overlay" id="modal-login">
    <div class="modal-content modal-sm modal-center-dialog">
      <div class="modal-badge-icon">
        <i class="ph-fill ph-lock-key"></i>
      </div>
      <h2>Akses Pengurus Kas</h2>
      <p>Masukkan password admin untuk mencatat transaksi dan mengelola data kas.</p>
      
      <form id="form-login-admin">
        <div class="form-group form-group-auth position-relative">
          <input type="password" id="input-admin-pwd" class="form-control input-admin-code" placeholder="Password Admin..." required autofocus>
          <button type="button" id="btn-toggle-pwd" class="btn-pwd-peek" aria-label="Lihat Password">
            <i class="ph ph-eye" id="icon-toggle-pwd"></i>
          </button>
        </div>
        <div class="modal-dialog-actions">
          <button type="button" class="btn btn-outline" data-action="close-modal">Batal</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-login">Masuk</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Modal Logout Admin Confirmation -->
  <div class="modal-overlay" id="modal-logout">
    <div class="modal-content modal-sm modal-center-dialog">
      <div class="modal-badge-icon slate">
        <i class="ph-bold ph-sign-out"></i>
      </div>
      <h2>Keluar Sesi Admin?</h2>
      <p>Anda perlu memasukkan password kembali untuk mencatat dan mengedit kas.</p>
      <div class="modal-dialog-actions">
        <button class="btn btn-outline" data-action="cancel-logout">Batal</button>
        <button class="btn btn-primary btn-slate-solid" data-action="confirm-logout" id="btn-logout-confirm">Ya, Keluar</button>
      </div>
    </div>
  </div>
