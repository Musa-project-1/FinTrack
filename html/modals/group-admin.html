  <!-- 0c. Modal Kelola Grup — khusus admin pemilik (tahap 4) -->
  <div class="modal-overlay modal-top" id="modal-group-admin">
    <div class="modal-content modal-md group-admin-modal">
      <div class="modal-header-standard">
        <div class="modal-header-left">
          <div class="modal-badge-icon">
            <i class="ph-fill ph-users-three"></i>
          </div>
          <div class="modal-title-wrap">
            <h2>Kelola Grup</h2>
            <p>Atur kelas atau buat ruang kas baru</p>
          </div>
        </div>
        <button class="close-modal-btn" data-action="close-modal" aria-label="Tutup"><i class="ph ph-x"></i></button>
      </div>

      <!-- Form Tambah Grup Baru (Linear / Vercel Card Style) -->
      <div class="group-admin-create-box">
        <div class="group-section-header">
          <i class="ph-bold ph-plus-circle text-primary"></i>
          <span>Tambah Grup Baru</span>
        </div>
        <form id="form-create-group" class="group-create-grid">
          <div class="input-with-icon flex-1 min-w-200">
            <i class="ph ph-users group-input-icon"></i>
            <input type="text" id="input-group-nama" class="form-control group-form-input" placeholder="Nama kelas / grup baru..." maxlength="60" required autocomplete="off">
          </div>
          <div class="input-with-icon w-140">
            <i class="ph ph-lock-key group-input-icon"></i>
            <input type="password" id="input-group-pin" class="form-control group-form-input text-center" inputmode="numeric" maxlength="4" placeholder="PIN 4 digit" required autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary btn-create-submit">
            <i class="ph-bold ph-plus"></i>
            <span>Buat</span>
          </button>
        </form>
      </div>

      <!-- Daftar Grup Terdaftar -->
      <div class="group-section-title-row">
        <span class="group-section-title">Grup Terdaftar</span>
        <span class="badge-count-pill" id="group-admin-count">Memuat...</span>
      </div>

      <div id="group-admin-list" class="group-admin-list"></div>

      <div class="group-admin-footer-notice">
        <i class="ph-fill ph-shield-check"></i>
        <span>Data tiap grup terisolasi aman. Hapus grup memerlukan konfirmasi nama.</span>
      </div>
    </div>
  </div>
