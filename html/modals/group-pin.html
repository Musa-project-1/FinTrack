  <!-- 0b. Modal PIN Grup (multi-grup tahap 2: 4 angka) -->
  <div class="modal-overlay modal-top" id="modal-group-pin">
    <div class="modal-content modal-sm" role="dialog" aria-modal="true" aria-labelledby="group-pin-name">
      <div class="modal-header-standard">
        <div class="modal-header-left">
          <div class="modal-badge-icon">
            <i class="ph-fill ph-lock-key"></i>
          </div>
          <div class="modal-title-wrap">
            <span class="eyebrow">Akses // PIN Grup</span>
            <h2 id="group-pin-name">Grup</h2>
            <p>Ketik PIN 4 angka grup ini</p>
          </div>
        </div>
        <button class="close-modal-btn" data-action="close-modal" aria-label="Tutup"><i class="ph ph-x"></i></button>
      </div>
      <div class="pin-row">
        <input id="pin0" name="pin0" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="0" aria-label="Digit PIN 1">
        <input id="pin1" name="pin1" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="1" aria-label="Digit PIN 2">
        <input id="pin2" name="pin2" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="2" aria-label="Digit PIN 3">
        <input id="pin3" name="pin3" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="3" aria-label="Digit PIN 4">
      </div>
      <p id="group-pin-msg" class="pin-msg" aria-live="polite"></p>
      <button class="btn btn-primary pin-action-btn" data-action="submit-group-pin">Masuk Grup</button>
      <button class="btn btn-outline pin-action-btn pin-action-btn-secondary" data-action="open-groups">Ganti Grup</button>
      <p class="pin-rate-limit-note">Salah 5 kali, terkunci 5 menit.</p>
    </div>
  </div>
