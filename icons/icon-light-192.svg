<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <!-- Light mode: Glacial Ocean background + Ice Blue border -->
  <circle cx="256" cy="256" r="240" fill="#f7fbfd" stroke="#c8dced" stroke-width="8"/>

  <!-- Ring: 4 semantic financial streams in crisp light palette -->
  <g fill="none" stroke-width="28" stroke-linecap="round">
    <!-- Top-Right: Pemasukan (Inflow) -->
    <path d="M 256 46 A 210 210 0 0 1 466 256" stroke="#0d9488"/>
    <!-- Bottom-Right: Pengeluaran (Outflow) -->
    <path d="M 466 256 A 210 210 0 0 1 256 466" stroke="#be123c"/>
    <!-- Bottom-Left: Operasional / Cadangan -->
    <path d="M 256 466 A 210 210 0 0 1 46 256" stroke="#0284c7"/>
    <!-- Top-Left: Iuran Warga -->
    <path d="M 46 256 A 210 210 0 0 1 256 46" stroke="#b45309"/>
  </g>

  <!-- Center: Monoline F + Saldo Coin -->
  <g fill="none" stroke="#0f5c56" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 296 176 L 216 176 L 216 336"/>
    <path d="M 216 250 L 282 250"/>
  </g>
  <circle cx="316" cy="250" r="14" fill="#0f5c56"/>
</svg>