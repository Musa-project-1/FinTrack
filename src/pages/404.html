<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404: Halaman Tidak Ditemukan | Finkas</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6fb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070d19">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=optional" rel="stylesheet" crossorigin="anonymous">
  <style>
    :root {
      color-scheme: light dark;

      /* Ocean Ledger — Light surfaces */
      --bg-canvas: #f3f6fb;
      --surface: #ffffff;
      --surface-2: #eaf0f8;
      --border: #cbd8ea;
      --text-main: #061b31;
      --text-muted: #425466;
      --accent: #0052ff;
      --accent-strong: #0040c9;
      --accent-ink: #ffffff;
      --accent-tint: rgba(0, 82, 255, 0.09);
      --accent-border: rgba(0, 82, 255, 0.30);
      --shadow-card: 0 12px 30px -8px rgba(0, 0, 0, 0.07), 0 2px 6px -1px rgba(0, 0, 0, 0.03);

      /* Radius scale */
      --r-btn: 8px;
      --r-card: 16px;
      --r-pill: 9999px;

      /* Motion */
      --t-state: 0.18s cubic-bezier(0.32, 0.72, 0, 1);

      /* Type */
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      --tracking-body: -0.01em;
      --tracking-display: -0.03em;
      --tracking-eyebrow: 0.14em;

      /* Spacing — 4px base */
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-6: 24px;
      --sp-8: 32px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #070d19;
        --surface: #0e172a;
        --surface-2: #16223b;
        --border: #1e2f50;
        --text-main: #f0f6fc;
        --text-muted: #94a3b8;
        --accent: #3b82f6;
        --accent-strong: #2563eb;
        --accent-ink: #ffffff;
        --accent-tint: rgba(59, 130, 246, 0.14);
        --accent-border: rgba(59, 130, 246, 0.34);
        --shadow-card: 0 12px 30px -8px rgba(0, 0, 0, 0.55), 0 2px 6px -1px rgba(0, 0, 0, 0.35);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg-canvas: light-dark(#f3f6fb, #070d19);
        --surface: light-dark(#ffffff, #0e172a);
        --surface-2: light-dark(#eaf0f8, #16223b);
        --border: light-dark(#cbd8ea, #1e2f50);
        --text-main: light-dark(#061b31, #f0f6fc);
        --text-muted: light-dark(#425466, #94a3b8);
        --accent: light-dark(#0052ff, #3b82f6);
        --accent-strong: light-dark(#0040c9, #2563eb);
        --accent-ink: light-dark(#ffffff, #ffffff);
        --accent-tint: light-dark(rgba(0, 82, 255, 0.09), rgba(59, 130, 246, 0.14));
        --accent-border: light-dark(rgba(0, 82, 255, 0.30), rgba(59, 130, 246, 0.34));
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      letter-spacing: var(--tracking-body);
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    ::selection {
      background: var(--accent-tint);
      color: var(--text-main);
    }
    a,
    button {
      touch-action: manipulation;
    }
    .container {
      width: 100%;
      max-width: 460px;
      padding: var(--sp-8);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      box-shadow: var(--shadow-card);
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--sp-6);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-tint);
      border: 1px solid var(--accent-border);
      border-radius: var(--r-btn);
      color: var(--accent);
    }
    .monogram { color: currentColor; flex-shrink: 0; }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 4px 12px;
      border-radius: var(--r-pill);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: var(--tracking-eyebrow);
      text-transform: uppercase;
      color: var(--text-main);
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .code-404 {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(72px, 20vw, 128px);
      line-height: 0.9;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      letter-spacing: var(--tracking-display);
      margin: var(--sp-3) 0 var(--sp-2);
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 24px;
      color: var(--text-main);
      margin-bottom: var(--sp-2);
    }
    p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 34ch;
      margin: 0 auto var(--sp-6);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      margin-top: var(--sp-6);
    }
    .btn-return,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--sp-2);
      min-height: 44px;
      padding: 14px 24px;
      border-radius: var(--r-btn);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      max-width: 100%;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-return {
      background: var(--accent-strong);
      color: var(--accent-ink);
      border: 1px solid transparent;
      transition: opacity var(--t-state), transform 0.1s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .arrow { flex-shrink: 0; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      transition: background-color var(--t-state), border-color var(--t-state), transform 0.1s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-return:hover { opacity: 0.9; }
      .btn-ghost:hover {
        background: var(--surface-2);
        border-color: var(--accent-border);
      }
    }
    .btn-return:active,
    .btn-ghost:active {
      transform: scale(0.97);
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    a:focus:not(:focus-visible),
    button:focus:not(:focus-visible) {
      outline: none;
    }
    .metadata {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: var(--tracking-eyebrow);
      color: var(--text-muted);
      margin-top: var(--sp-6);
    }
    @media (max-width: 359px) {
      .container { padding: var(--sp-6); }
      .btn-return,
      .btn-ghost { padding-inline: var(--sp-3); font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn-return,
      .btn-ghost { transition: none; }
      .btn-return:active,
      .btn-ghost:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-badge">
      <svg class="monogram" viewBox="0 0 192 192" width="36" height="36" role="img" aria-label="Logo Finkas" focusable="false">
        <g transform="translate(51, 47)" fill="currentColor">
          <rect x="0" y="0" width="18" height="98" rx="9" />
          <rect x="0" y="0" width="82" height="18" rx="9" />
          <rect x="0" y="36" width="60" height="18" rx="9" opacity="0.72" />
          <circle cx="74" cy="45" r="9" opacity="0.55" />
        </g>
      </svg>
    </div>
    <span class="badge-pill">ERROR 404</span>
    <div class="code-404">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Tautan yang Anda tuju mungkin salah ketik, sudah dipindahkan, atau tidak lagi tersedia.</p>
    <div class="btn-group">
      <a class="btn-return" href="index.html">KEMBALI KE BERANDA
        <svg class="arrow" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <path d="M2.5 8h11M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="btn-ghost" href="onboarding.html">PILIH GRUP KAS</a>
    </div>
    <footer class="metadata">FINKAS · PEMBUKUAN KAS KOMUNITAS</footer>
  </main>
</body>
</html>
