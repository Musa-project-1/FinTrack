<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | Finkas</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6fb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070d19">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <style>
    :root {
      color-scheme: light dark;

      /* Ocean Ledger — Light surfaces */
      --bg-canvas: #f3f6fb;
      --surface: #ffffff;
      --surface-2: #eaf0f8;
      --border: #cbd8ea;
      --text-main: #061b31;
      --text-muted: #425466;
      --accent: #0052ff;
      --accent-strong: #0040c9;
      --accent-ink: #ffffff;
      --accent-tint: rgba(0, 82, 255, 0.09);
      --accent-border: rgba(0, 82, 255, 0.30);
      --shadow-card: 0 12px 30px -8px rgba(0, 0, 0, 0.07), 0 2px 6px -1px rgba(0, 0, 0, 0.03);

      /* Radius scale */
      --r-btn: 8px;
      --r-card: 16px;
      --r-pill: 9999px;

      /* Motion */
      --t-state: 0.18s cubic-bezier(0.32, 0.72, 0, 1);

      /* Type — zero-network system stack */
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --tracking-body: -0.01em;
      --tracking-eyebrow: 0.14em;

      /* Spacing — 4px base */
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-6: 24px;
      --sp-8: 32px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #070d19;
        --surface: #0e172a;
        --surface-2: #16223b;
        --border: #1e2f50;
        --text-main: #f0f6fc;
        --text-muted: #94a3b8;
        --accent: #3b82f6;
        --accent-strong: #2563eb;
        --accent-ink: #ffffff;
        --accent-tint: rgba(59, 130, 246, 0.14);
        --accent-border: rgba(59, 130, 246, 0.34);
        --shadow-card: 0 12px 30px -8px rgba(0, 0, 0, 0.55), 0 2px 6px -1px rgba(0, 0, 0, 0.35);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg-canvas: light-dark(#f3f6fb, #070d19);
        --surface: light-dark(#ffffff, #0e172a);
        --surface-2: light-dark(#eaf0f8, #16223b);
        --border: light-dark(#cbd8ea, #1e2f50);
        --text-main: light-dark(#061b31, #f0f6fc);
        --text-muted: light-dark(#425466, #94a3b8);
        --accent: light-dark(#0052ff, #3b82f6);
        --accent-strong: light-dark(#0040c9, #2563eb);
        --accent-ink: light-dark(#ffffff, #ffffff);
        --accent-tint: light-dark(rgba(0, 82, 255, 0.09), rgba(59, 130, 246, 0.14));
        --accent-border: light-dark(rgba(0, 82, 255, 0.30), rgba(59, 130, 246, 0.34));
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      letter-spacing: var(--tracking-body);
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    ::selection {
      background: var(--accent-tint);
      color: var(--text-main);
    }
    a,
    button {
      touch-action: manipulation;
    }
    .container {
      width: 100%;
      max-width: 460px;
      padding: var(--sp-8);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      box-shadow: var(--shadow-card);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--sp-6);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-tint);
      border: 1px solid var(--accent-border);
      border-radius: 50%;
      color: var(--accent);
    }
    .icon-container svg {
      width: 40px;
      height: 40px;
      stroke: currentColor;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 4px 12px;
      border-radius: var(--r-pill);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: var(--tracking-eyebrow);
      text-transform: uppercase;
      color: var(--text-main);
      white-space: normal;
      overflow-wrap: anywhere;
      margin-bottom: var(--sp-4);
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: var(--sp-3);
      color: var(--text-main);
    }
    p {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: var(--sp-6);
      line-height: 1.5;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--sp-2);
      background: var(--accent-strong);
      color: var(--accent-ink);
      border: 1px solid transparent;
      border-radius: var(--r-btn);
      padding: 14px 24px;
      min-height: 44px;
      max-width: 100%;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity var(--t-state), transform 0.1s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .btn-retry svg {
      flex-shrink: 0;
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-retry:hover { opacity: 0.9; }
    }
    .btn-retry:active {
      transform: scale(0.97);
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    button:focus:not(:focus-visible),
    a:focus:not(:focus-visible) {
      outline: none;
    }
    @media (max-width: 359px) {
      .container { padding: var(--sp-6); }
      .btn-retry { padding-inline: var(--sp-4); font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn-retry { transition: none; }
      .btn-retry:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true" focusable="false">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 7.5l16.5-4.125M12 6.75c-2.708 0-5.363.224-7.948.652A2.25 2.25 0 00-.75 9.55v8.7a2.25 2.25 0 002.25 2.25h15a2.25 2.25 0 002.25-2.25v-8.7a2.25 2.25 0 00-2.198-2.2A47.865 47.865 0 0012 6.75z" />
      </svg>
    </div>
    <span class="badge-pill">Status Koneksi</span>
    <h1>Anda Sedang Offline</h1>
    <p>Tidak dapat terhubung ke jaringan. Periksa koneksi internet Anda dan coba lagi.</p>
    <button type="button" class="btn-retry">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Coba Lagi
    </button>
  </main>
  <script src="src/pages/offline.js" defer></script>
</body>
</html>
